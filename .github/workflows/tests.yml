name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript regression tests
        run: node --test tests/refinement.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in static/js/*.js; do
            node --check "$file" || exit 1
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: unicut-ci
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker compose build
      - name: Start container
        run: docker compose up --wait --wait-timeout 300
      - name: Check container and brush API
        run: docker compose exec -T unicut python - < tests/docker_smoke.py
      - name: Write cache marker
        run: docker compose exec -T unicut python -c "from pathlib import Path; Path('/home/unicut/.cache/.ci-marker').write_text('persistent')"
      - name: Recreate container
        run: docker compose up --force-recreate --wait --wait-timeout 300
      - name: Verify cache survives recreation
        run: docker compose exec -T unicut python -c "from pathlib import Path; assert Path('/home/unicut/.cache/.ci-marker').read_text() == 'persistent'"
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop container
        if: always()
        run: docker compose down --volumes
